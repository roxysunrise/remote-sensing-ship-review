<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1218">
<meta name="color-scheme" content="light">
<title>登录 · 遥感影像船舶检测与复核</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232f5bff'/%3E%3Cpath d='M6 20h20l-4 6H10z' fill='%23ffffff'/%3E%3Crect x='14' y='7' width='4' height='12' fill='%23ffffff'/%3E%3C/svg%3E">
<link rel="preload" as="image" href="assets/harbor-login.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css?v=20">
</head>
<body>

<div class="scene" aria-hidden="true">
  <img src="assets/harbor-login.webp" alt="" width="1920" height="1440" decoding="async">
</div>

<main class="split">

  <section class="intro">
    <div class="intro-brand">
      <span class="mark" aria-hidden="true">船</span>
      <span class="brand-text">遥感船舶检测与复核<small>ship-detection / 0.2</small></span>
    </div>

    <div class="intro-copy">
      <p class="kicker">// HARBOR REMOTE SENSING</p>
      <h1>让每一处检测<br>都有据可查。</h1>
      <p class="lede">
        面向港口巡查的影像分析工作台。大图切片推理、旋转框人工复核、
        版本留痕与区域统计，在同一条流程里完成。
      </p>
    </div>

    <div class="intro-foot">
      <span>港口巡查 · 受控接入 · 无公开注册</span>
      <span>© 2026 SHIP REVIEW</span>
    </div>
  </section>

  <section class="panel" aria-labelledby="login-title">
    <div class="channels" aria-hidden="true"><i></i><i></i><i></i></div>

    <div class="panel-inner">
      <header class="panel-head">
        <p class="panel-kicker">// SECURE ACCESS</p>
        <h2 id="login-title">登录工作台</h2>
        <p class="hint">使用管理员分配的账号进入项目空间。</p>
      </header>

      <div class="alert" id="alert" role="alert" hidden>
        <span class="alert-icon" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="15" height="15">
            <circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.3"/>
            <path d="M8 4.7v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <circle cx="8" cy="11.2" r=".95" fill="currentColor"/>
          </svg>
        </span>
        <div class="alert-body">
          <p id="alert-msg"></p>
          <code id="alert-code" hidden></code>
        </div>
      </div>

      <form id="login-form" novalidate autocomplete="on">
        <div class="field">
          <label for="username">账号</label>
          <div class="control">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
              <path d="M4.8 19.2c.6-3.6 3.4-5.4 7.2-5.4s6.6 1.8 7.2 5.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            <input id="username" name="username" type="text" autocomplete="username"
                   spellcheck="false" autocapitalize="none" autocorrect="off"
                   placeholder="如 roxysunrise" maxlength="64" required
                   aria-describedby="err-user" autofocus>
          </div>
          <span class="field-err" id="err-user" role="alert"></span>
        </div>

        <div class="field">
          <label for="password">密码</label>
          <div class="control">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
              <path d="M8 10V7.8a4 4 0 0 1 8 0V10" fill="none" stroke="currentColor" stroke-width="1.6"/>
            </svg>
            <input id="password" name="password" type="password" autocomplete="current-password"
                   placeholder="••••••••" required aria-describedby="err-pass">
            <button class="reveal" id="toggle-pass" type="button" aria-label="显示密码" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
                <path d="M2.5 12s3.6-6.5 9.5-6.5S21.5 12 21.5 12 17.9 18.5 12 18.5 2.5 12 2.5 12Z"
                      fill="none" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="12" cy="12" r="2.7" fill="none" stroke="currentColor" stroke-width="1.5"/>
              </svg>
            </button>
          </div>
          <span class="field-err" id="err-pass" role="alert"></span>
          <p class="caps" id="caps" aria-live="polite" hidden>大写锁定已开启</p>
        </div>

        <div class="field">
          <label for="project">项目空间</label>
          <div class="control">
            <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m12 3 8 4.5-8 4.5-8-4.5L12 3Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="m4 12 8 4.5 8-4.5M4 16.5 12 21l8-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            </svg>
            <input id="project" name="project" type="text" list="project-list" autocomplete="off"
                   spellcheck="false" placeholder="如 harbor-a" maxlength="64" required
                   aria-describedby="err-project">
            <datalist id="project-list"></datalist>
          </div>
          <span class="field-err" id="err-project" role="alert"></span>
        </div>

        <label class="remember" for="remember">
          <input type="checkbox" id="remember" checked>
          <span class="box" aria-hidden="true"></span>
          <span>在此设备上保持登录 <em>7 天</em></span>
        </label>

        <button class="submit" id="submit" type="submit">
          <span class="spinner" aria-hidden="true"></span>
          <span class="label">登录</span>
          <svg class="btn-arrow" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h13M12.5 6.5 19 12l-6.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
    </div>
  </section>

</main>

<noscript>
  <div class="noscript">本页需要启用 JavaScript 才能登录。</div>
</noscript>

<script src="config.js"></script>
<script src="auth-config.js"></script>
<script src="auth-session.js"></script>
<script src="login.js?v=2"></script>
</body>
</html>
